[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Romaissa Emelhaoui", email = "romaissae.melhaoui@gmail.com" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mlflow>=3.17.2",
    "pandas>=3.0.6",
    "prefect>=3.9.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy<2.1",  # Prefect 3.9 scheduler fails with SQLAlchemy 2.1
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false
